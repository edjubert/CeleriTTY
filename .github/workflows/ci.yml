name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: wasm32-unknown-unknown
          components: rustfmt

      # Pinned: the action resolves "latest" per run and has handed out
      # 0.9.1, which predates workspace inheritance and cannot parse
      # license.workspace = true in the crate manifests.
      - uses: jetli/wasm-pack-action@v0.4.0
        # The installer renames into ~/.cargo/bin. Extract on the same
        # filesystem to avoid EXDEV on hosted runners with a separate /tmp.
        env:
          TMPDIR: ${{ env.CARGO_HOME }}
        with:
          version: "v0.15.0"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust tests
        run: cargo test --workspace

      - name: Rust wasm target
        run: cargo build --target wasm32-unknown-unknown

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm ts-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: TypeScript tests
        run: pnpm test:ts

      - name: Unused exports
        run: pnpm knip

  browser:
    # Keep the browser runner on a Playwright-supported Ubuntu release.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: wasm32-unknown-unknown
      # Pinned: the action resolves "latest" per run and has handed out
      # 0.9.1, which predates workspace inheritance and cannot parse
      # license.workspace = true in the crate manifests.
      - uses: jetli/wasm-pack-action@v0.4.0
        # Match the destination filesystem for the installer's rename.
        env:
          TMPDIR: ${{ env.CARGO_HOME }}
        with:
          version: "v0.15.0"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install software GPU and debugger test applications
        run: |
          sudo apt-get install -y --no-install-recommends fish neovim mesa-vulkan-drivers vulkan-tools
          # Mesa 25 removed the architecture suffix from its ICD manifest names.
          vulkan_driver_manifests=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#vulkan_driver_manifests[@]}" -eq 1
          test -f "${vulkan_driver_manifests[0]}"
          printf 'VK_DRIVER_FILES=%s\n' "${vulkan_driver_manifests[0]}" >> "$GITHUB_ENV"
      - name: Native Vulkan driver diagnostics
        run: xvfb-run -a vulkaninfo --summary
      - name: Real WASM and WebGPU browser regressions
        env:
          DEBUG: pw:browser
        run: xvfb-run -a pnpm test:browser --headed --max-failures=1
      - name: Contributor debugger and local PTY regressions
        run: xvfb-run -a pnpm test:debug --headed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
