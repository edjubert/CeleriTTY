name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm authenticates this workflow over OIDC, so
      # there is no NPM_TOKEN secret to create, store or rotate. It has to be
      # enabled once on the package's npm settings page, which requires the
      # package to exist — so the first publish is manual (`npm publish`
      # locally, with 2FA) and every release after it runs from here.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: wasm32-unknown-unknown

      # Pinned: the action resolves "latest" per run and has handed out
      # 0.9.1, which predates workspace inheritance and cannot parse
      # license.workspace = true in the crate manifests.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.15.0"
      - uses: pnpm/action-setup@v4
      # Node 24.21.0 ships npm 11.19.0. Trusted publishing needs 11.5.1 or
      # later, so the bundled npm is enough and nothing is installed globally.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # The same gates as CI: a tag must not publish what a pull request
      # would have rejected.
      - run: cargo test --workspace
      - run: pnpm build
      - run: pnpm ts-check
      - run: pnpm lint
      - run: pnpm test:ts

      # No --access public: that flag only matters for scoped packages, and
      # celeritty is unscoped and therefore public by default.
      # npm rather than pnpm: pnpm has no trusted-publishing support, so it
      # sends whatever sits in .npmrc and npm answers 404 on the PUT. Leave
      # NODE_AUTH_TOKEN unset so the OIDC exchange is what authenticates.
      - run: npm publish
